function applyPrefs() { document.body.classList.toggle('compact', !!State.prefs.compact); document.body.classList.toggle('no-anim', !!State.prefs.noAnim); }

function renderSettings(v) {
  const sw = (id, title, text, on) => `<div class="switch-row"><div><b>${title}</b><p>${text}</p></div><label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><i></i></label></div>`;
  v.innerHTML = pageHead('Налаштування', 'Вигляд інтерфейсу та службові дії') + `
  <div class="grid cols2">
    <section class="card"><div class="card-h"><h2>Інтерфейс</h2></div>
      ${sw('sCompact', 'Компактні таблиці', 'Менші відступи в рядках таблиць', State.prefs.compact)}
      ${sw('sAnim', 'Вимкнути анімації', 'Прибирає переходи та рухи інтерфейсу', State.prefs.noAnim)}
    </section>
    <section class="card"><div class="card-h"><h2>Дані та сесія</h2></div>
      <div class="kv" style="border-top:0"><span>Telegram-лог</span><b>продажі від ${fmtMoney(threshold())}</b></div>
      <div class="kv"><span>Збереження</span><b>Google Sheets</b></div>
      <div class="actions between" style="margin-top:18px"><button class="btn" id="sRefresh">${icon('refresh', 16)} Оновити дані</button><button class="btn danger" id="sLogout">${icon('logout', 16)} Вийти</button></div>
      <div class="actions" style="margin-top:10px"><button class="btn ghost sm" id="sClearCalc">Очистити чернетку калькулятора</button></div>
    </section>
  </div>`;
  $('#sCompact').onchange = e => { State.prefs.compact = e.target.checked; savePrefs(); };
  $('#sAnim').onchange = e => { State.prefs.noAnim = e.target.checked; savePrefs(); };
  $('#sRefresh').onclick = e => guard(e.currentTarget, async () => { applyState(await api('getBootstrap')); toast('Дані оновлено'); });
  $('#sLogout').onclick = logout;
  $('#sClearCalc').onclick = () => { State.calc = defaultCalc(); saveCalc(); toast('Чернетку очищено'); };
}

/* ==========================================================
   АДМІН-ПАНЕЛЬ (керування акаунтами + повний облік дій)
   ========================================================== */
const ACT_EMOJI = { login: '🔑', hunt_start: '🧭', hunt_finish: '🏁', hunt_force: '⛔', expense: '💸', treasure: '💎', map_failed: '🗺️', sale: '💰', item: '📦', admin: '🛡️' };
const ADMIN_TABS = [['overview', '📈', 'Огляд'], ['users', '👥', 'Учасники'], ['hunts', '🧭', 'Пошуки'], ['activity', '🕵️', 'Активність']];

const uName = u => u.nickname || u.login || '—';
const uFull = u => ((u.firstName || '') + ' ' + (u.lastName || '')).trim();
const uAvatar = u => `<span class="uav">${esc(initials(uName(u)))}</span>`;
const isMe = u => String(u.id) === String(State.profile.id);
const genPass = (n = 10) => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => c[x % c.length]).join(''); };
const huntOf = (h, u) => h.userId != null ? String(h.userId) === String(u.id) : h.nickname === u.nickname;
const tlItem = (a, withUser = true) => `<div class="tl-i"><span class="tl-e">${ACT_EMOJI[a.type] || '•'}</span><div><div>${withUser ? `<b>${esc(a.nickname)}</b> ` : ''}${esc(a.text)}</div><small>${fmtDate(a.date)} ${fmtTime(a.time)} · ${ACT_TYPES[a.type] || esc(a.type)}</small></div></div>`;

function prepAdmin(A) {
  A.users = A.users || []; A.hunts = A.hunts || [];
  A.act = (A.activity || []).map(a => ({ ...a, _k: String(a.date || '') + String(a.time || ''), _s: norm((a.nickname || '') + ' ' + (a.text || '') + ' ' + (ACT_TYPES[a.type] || a.type)) }))
    .sort((a, b) => b._k.localeCompare(a._k));
  A.byId = new Map(A.users.map(u => [String(u.id), u]));
  if (A.meta) { State.adm.rev = A.meta.g; State.rev.u = A.meta.u; }   // власні дії адміна не викликають зайвих оновлень
  return A;
}

async function loadAdmin(force = false, silent = false) {
  if (!force && State.admin && Date.now() - State.adm.ts < 15000) return State.admin;
  State.admin = prepAdmin(await api('getAdminOverview', {}, { silent }));
  State.adm.ts = Date.now();
  return State.admin;
}

/** Адмін-дія: бекенд повертає оновлений огляд (або ми перезавантажуємо його самі) */
async function adminApi(action, payload) {
  try {
    const d = await api(action, payload);
    if (d && Array.isArray(d.users)) { State.admin = prepAdmin(d); State.adm.ts = Date.now(); }
    else await loadAdmin(true, true);
    return d;
  } catch (e) {
    if (/action|дія|дію|невідом|unknown|not supported/i.test(e.message || '')) e.message += ` (потрібно оновити Apps Script: додайте дію «${action}»)`;
    throw e;
  }
}

function startAdminLive() { Live.loop(); }
function stopAdminLive() { Live.loop(); }     // інтервал сам підлаштовується під поточну сторінку
function toggleLive() {
  const S = State.adm; S.live = !S.live;
  const b = $('#adLive');
  if (b) { b.classList.toggle('primary', S.live); b.textContent = S.live ? '🟢 Live: реальний час' : '⚪ Live: вимкнено'; }
  if (S.live) Live.kick(); else Live.loop();
  toast(S.live ? 'Live увімкнено: зміни з’являються за 2–3 секунди' : 'Live вимкнено');
}

function setAdminTab(t, v) {
  State.adminTab = t;
  $$('.tab', v).forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  drawAdmin(true);
}

function renderAdmin(v) {
  const S = State.adm;
  v.innerHTML = pageHead('Адмін-панель', 'Керування акаунтами та повний контроль дій учасників',
    `<button class="btn ${S.live ? 'primary' : ''}" id="adLive">${S.live ? '🟢 Live: реальний час' : '⚪ Live: вимкнено'}</button>
     <button class="btn" id="adRefresh">${icon('refresh', 16)} Оновити</button>
     <button class="btn primary" data-ucreate>➕ Створити акаунт</button>`) + `
    <div class="tabs" role="tablist">
      ${ADMIN_TABS.map(([k, e, l]) => `<button class="tab ${State.adminTab === k ? 'active' : ''}" data-tab="${k}">${e} ${l}</button>`).join('')}
    </div>
    <div id="adBody"><div class="card"><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div></div>`;

  v.onclick = e => {
    const t = e.target; let b;
    if ((b = t.closest('[data-tab]'))) return setAdminTab(b.dataset.tab, v);
    if (t.closest('#adLive')) return toggleLive();
    if (t.closest('#adRefresh')) return guard($('#adRefresh'), async () => { await loadAdmin(true); drawAdmin(true); });
    if (t.closest('[data-ucreate]')) return openUserForm(null);
    if ((b = t.closest('[data-uview]'))) return openUserDetail(b.dataset.uview);
    if ((b = t.closest('[data-uedit]'))) return openUserForm(State.admin.byId.get(b.dataset.uedit));
    if ((b = t.closest('[data-ublock]'))) return adminToggleBlock(b.dataset.ublock);
    if ((b = t.closest('[data-fin]'))) return adminFinish(+b.dataset.fin);
    if (t.closest('#adExport')) return exportActivity();
    if ((b = t.closest('[data-more]'))) {
      if (b.dataset.more === 'act') State.adm.alim += PAGE_SIZE; else if (b.dataset.more === 'hunts') State.adm.hlim += PAGE_SIZE;
      return drawAdmin(false);
    }
  };
  const onFilter = e => {
    const k = e.target.dataset && e.target.dataset.af; if (!k) return;
    State.adm[k] = e.target.value; State.adm.hlim = State.adm.alim = PAGE_SIZE;
    drawAdmin(false);
  };
  const isText = t => t.tagName === 'INPUT' && (t.type === 'search' || t.type === 'text');
  const deb = debounce(onFilter, 160);
  v.oninput = e => { if (isText(e.target)) deb(e); };
  v.onchange = e => { if (!isText(e.target)) onFilter(e); };

  if (S.live) startAdminLive();
  if (State.admin) drawAdmin(true);
  guard(null, async () => { await loadAdmin(false, !!State.admin); if (State.page === 'admin' && $('#adBody')) drawAdmin(false); });
}

/* ---------- відмальовка ---------- */
function drawAdmin(full = true) {
  const A = State.admin, body = $('#adBody'); if (!A || !body) return;
  const t = State.adminTab;
  if (full || t === 'overview' || !$('#adList')) body.innerHTML = adminShell(A, t);
  const list = $('#adList');
  if (list) list.innerHTML = adminList(A, t);
}

function userSelect(A, key, val, label = 'Учасник') {
  return `<div class="field"><span>${label}</span><select class="input" data-af="${key}"><option value="all">Усі учасники</option>${A.users.map(u => `<option value="${u.id}" ${val === String(u.id) ? 'selected' : ''}>${esc(uName(u))}</option>`).join('')}</select></div>`;
}
const searchField = (key, val, ph) => `<div class="field grow"><span>Пошук</span><div class="input-affix search"><i>${icon('search', 16)}</i><input class="input" type="search" data-af="${key}" placeholder="${ph}" value="${esc(val)}"></div></div>`;

function adminShell(A, t) {
  const S = State.adm;
  if (t === 'overview') return adminOverviewHTML(A);
  if (t === 'users') return `<section class="card filters">${searchField('uq', S.uq, 'Нікнейм, логін, ім’я')}
      <div class="field"><span>Показати</span><select class="input" data-af="ust">${[['all', 'Усіх'], ['active', 'Активних'], ['blocked', 'Заблокованих'], ['hunting', 'Хто шукає зараз']].map(([k, l]) => `<option value="${k}" ${S.ust === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="toolbar-actions"><button class="btn primary" data-ucreate>➕ Створити акаунт</button></div></section>
    <section class="card p0" id="adList"></section>`;
  if (t === 'hunts') return `<section class="card filters">${searchField('hq', S.hq, 'Нікнейм учасника')}
      ${userSelect(A, 'hu', S.hu)}
      <div class="field"><span>Статус</span><select class="input" data-af="hst">${[['all', 'Усі'], ['active', 'Активні'], ['finished', 'Завершені']].map(([k, l]) => `<option value="${k}" ${S.hst === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></section>
    <section class="card p0" id="adList"></section>`;
  return `<section class="card filters">${searchField('aq', S.aq, 'Текст події, нікнейм')}
      ${userSelect(A, 'au', S.au)}
      <div class="field"><span>Тип дії</span><select class="input" data-af="atype"><option value="all">Усі типи</option>${Object.entries(ACT_TYPES).map(([k, l]) => `<option value="${k}" ${S.atype === k ? 'selected' : ''}>${ACT_EMOJI[k] || ''} ${l}</option>`).join('')}</select></div>
      <div class="field"><span>Від</span><input class="input" type="date" data-af="afrom" value="${S.afrom}"></div>
      <div class="field"><span>До</span><input class="input" type="date" data-af="ato" value="${S.ato}"></div>
      <div class="toolbar-actions"><button class="btn" id="adExport">⬇️ CSV</button></div></section>
    <section class="card p0" id="adList"></section>`;
}

function adminList(A, t) {
  return t === 'users' ? adminUsersList(A) : t === 'hunts' ? adminHuntsList(A) : t === 'activity' ? adminActivityList(A) : '';
}

function liveCard(u) {
  const h = u.activeHunt, pct = h.expenses > 0 ? Math.min(100, Math.round(h.income / h.expenses * 100)) : 0;
  return `<div class="live-card"><div class="top">${uAvatar(u)}<div><b>${esc(uName(u))}</b><br><small>Пошук №${h.id}</small></div><button class="icon-btn" style="margin-left:auto" data-uview="${u.id}" title="Деталі">👁️</button></div>
    <div class="progress ${h.income >= h.expenses && h.expenses > 0 ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
    <small>🗺️ карти ${h.mapsUsed}/${h.mapsTotal} · 💸 ${fmtMoney(h.expenses)} · 💰 ${fmtMoney(h.income)}</small></div>`;
}

function adminOverviewHTML(A) {
  const U = A.users, hunting = U.filter(u => u.activeHunt), blocked = U.filter(u => u.status === 'blocked').length;
  const T = A.totals || {};
  const salesC = T.salesTotal != null ? cents(T.salesTotal) : U.reduce((a, u) => a + cents(u.salesTotal), 0);
  const salesN = T.salesCount != null ? T.salesCount : U.reduce((a, u) => a + (+u.salesCount || 0), 0);
  const profitC = T.profit != null ? cents(T.profit) : A.hunts.reduce((a, h) => a + cents(h.profit), 0);
  const activeH = T.activeHunts != null ? T.activeHunts : A.hunts.filter(h => h.status === 'active').length;
  const huntsAll = T.huntsCount != null ? T.huntsCount : A.hunts.length;
  const top = U.filter(u => num(u.salesTotal) > 0).sort((a, b) => num(b.salesTotal) - num(a.salesTotal)).slice(0, 5);
  const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
  return `<div class="grid stats">
      ${statCard('Учасників', U.length, 'users', 'blue', `Заблоковано: ${blocked}`)}
      ${statCard('Шукають зараз', hunting.length, 'compass', 'green', `Активних пошуків: ${activeH}`)}
      ${statCard('Сума продажів', fmtMoney(salesC / 100), 'cash', 'gold', `Продажів: ${salesN}`)}
      ${statCard('Результат пошуків', `<span class="${tone(profitC / 100)}">${signed(profitC / 100)}</span>`, 'dollar', 'gold', `Пошуків усього: ${huntsAll}`)}
    </div>
    <div class="grid two">
      <section class="card"><div class="card-h"><h2>🟢 Зараз у пошуку</h2></div>${hunting.length ? `<div class="live-grid">${hunting.map(liveCard).join('')}</div>` : emptyState('compass', 'Зараз ніхто не шукає', 'Активні пошуки зʼявляться тут')}</section>
      <section class="card"><div class="card-h"><h2>🏆 Топ за продажами</h2></div>${top.length ? top.map((u, i) => `<div class="rank-row"><span>${medals[i]}</span>${uAvatar(u)}<div><b>${esc(uName(u))}</b><br><small class="muted">${u.salesCount} прод.</small></div><b class="gold">${fmtMoney(u.salesTotal)}</b></div>`).join('') : emptyState('trophy', 'Продажів ще немає')}</section>
    </div>
    <section class="card"><div class="card-h"><h2>🕵️ Остання активність</h2><button class="chip" data-tab="activity">Увесь журнал</button></div>
      <div class="tl">${A.act.slice(0, 12).map(a => tlItem(a)).join('') || emptyState('history', 'Записів немає')}</div></section>`;
}

function adminUsersList(A) {
  const S = State.adm, q = norm(S.uq);
  const list = A.users.filter(u => (S.ust === 'all' || (S.ust === 'hunting' ? !!u.activeHunt : u.status === S.ust)) && (!q || norm([u.nickname, u.login, u.firstName, u.lastName].join(' ')).includes(q)));
  if (!list.length) return emptyState('users', 'Учасників не знайдено', 'Змініть пошук або створіть новий акаунт');
  return `<div class="summary-line">Учасників: <b>${list.length}</b></div><div class="table-wrap"><table class="table stack"><thead><tr><th>Учасник</th><th>Роль</th><th>Статус</th><th>Пошук зараз</th><th class="r">Пошуків</th><th class="r">Продажі</th><th>Остання дія</th><th></th></tr></thead><tbody>
    ${list.map(u => { const me = isMe(u), h = u.activeHunt, la = u.lastActivity;
      return `<tr>
      <td data-label="Учасник"><div class="user-cell">${uAvatar(u)}<div><div class="cell-main">${esc(uName(u))}${me ? ' <span class="chip gold">Ви</span>' : ''}</div><div class="cell-sub">${esc(uFull(u))}${uFull(u) ? ' · ' : ''}${esc(u.login)}</div></div></div></td>
      <td data-label="Роль"><span class="chip ${u.role === 'admin' ? 'gold' : ''}">${u.role === 'admin' ? '🛡️ Адмін' : '🧑‍✈️ Користувач'}</span></td>
      <td data-label="Статус"><span class="chip ${u.status === 'blocked' ? 'red' : 'green'}">${u.status === 'blocked' ? '⛔ Заблоковано' : '✅ Активний'}</span></td>
      <td data-label="Пошук зараз">${h ? `<span class="chip green">№${h.id}</span> карти ${h.mapsUsed}/${h.mapsTotal}<div class="cell-sub">витрати ${fmtMoney(h.expenses)}, дохід ${fmtMoney(h.income)}</div>` : '<span class="muted">не шукає</span>'}</td>
      <td class="r" data-label="Пошуків">${u.huntsCount}</td>
      <td class="r" data-label="Продажі">${fmtMoney(u.salesTotal)}<div class="cell-sub">${u.salesCount} прод.</div></td>
      <td data-label="Остання дія">${la ? `<div>${esc(la.text)}</div><div class="cell-sub">${fmtDate(la.date)} ${fmtTime(la.time)}</div>` : '<span class="muted">—</span>'}</td>
      <td class="r nolabel"><div class="row-actions"><button class="icon-btn" data-uview="${u.id}" title="Деталі та історія дій">👁️</button><button class="icon-btn" data-uedit="${u.id}" title="Редагувати">✏️</button>${me ? '' : `<button class="icon-btn" data-ublock="${u.id}" title="${u.status === 'blocked' ? 'Розблокувати' : 'Заблокувати'}">${u.status === 'blocked' ? '🔓' : '🔒'}</button>`}</div></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function adminHuntsList(A) {
  const S = State.adm, q = norm(S.hq), uu = S.hu === 'all' ? null : A.byId.get(S.hu);
  const list = A.hunts.filter(h => (S.hst === 'all' || (S.hst === 'active' ? h.status === 'active' : h.status !== 'active')) && (!uu || huntOf(h, uu)) && (!q || norm(h.nickname).includes(q)));
  if (!list.length) return emptyState('compass', 'Пошуків не знайдено', 'Змініть фільтри');
  const n = Math.min(list.length, S.hlim);
  return `<div class="table-wrap"><table class="table stack"><thead><tr><th>Учасник</th><th>Старт</th><th>Статус</th><th class="r">Карти</th><th class="r">Витрати</th><th class="r">Дохід</th><th class="r">Результат</th><th class="r">Непродано</th><th></th></tr></thead><tbody>
    ${list.slice(0, n).map(h => `<tr><td class="cell-main" data-label="Учасник">${esc(h.nickname)}<div class="cell-sub">пошук №${h.id}</div></td><td data-label="Старт">${fmtDate(h.startDate)}<div class="cell-sub">${fmtTime(h.startTime)}</div></td><td data-label="Статус">${huntBadge(h)}${h.endDate ? `<div class="cell-sub">${fmtDate(h.endDate)} ${fmtTime(h.endTime)}</div>` : ''}</td>
      <td class="r" data-label="Карти">${h.mapsUsed}/${h.mapsTotal}<div class="cell-sub">не спрацювало: ${h.mapsFailed}</div></td><td class="r" data-label="Витрати">${fmtMoney(h.expenses)}</td><td class="r" data-label="Дохід">${fmtMoney(h.income)}</td><td class="r ${tone(h.profit)}" data-label="Результат" style="font-weight:800">${signed(h.profit)}</td>
      <td class="r" data-label="Непродано">${h.stockCount ? `${h.stockCount} шт.<div class="cell-sub">${fmtMoney(h.stockValue)}</div>` : '—'}</td>
      <td class="r nolabel">${h.status === 'active' ? `<button class="btn sm ${h.finish.canFinish ? '' : 'danger'}" data-fin="${h.id}">${icon('flag', 14)} Завершити</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>${moreBtn(n, list.length, 'hunts')}<div class="table-foot"><span>Показано: ${n} з ${list.length}</span></div>`;
}

function filteredActivity(A) {
  const S = State.adm, q = norm(S.aq);
  return A.act.filter(a => (S.au === 'all' || String(a.userId) === S.au) && (S.atype === 'all' || a.type === S.atype) && (!S.afrom || a.date >= S.afrom) && (!S.ato || a.date <= S.ato) && (!q || a._s.includes(q)));
}

function adminActivityList(A) {
  const S = State.adm, list = filteredActivity(A);
  if (!list.length) return emptyState('history', 'Записів немає', 'Змініть фільтри');
  const n = Math.min(list.length, S.alim);
  return `<div class="summary-line">Знайдено подій: <b>${list.length}</b></div><div class="table-wrap"><table class="table stack"><thead><tr><th>Коли</th><th>Учасник</th><th>Дія</th><th>Подробиці</th></tr></thead><tbody>
    ${list.slice(0, n).map(a => `<tr><td data-label="Коли">${fmtDate(a.date)} ${fmtTime(a.time)}</td><td class="cell-main" data-label="Учасник">${esc(a.nickname)}</td><td data-label="Дія"><span class="chip ${/force|failed/.test(a.type) ? 'gold' : ''}">${ACT_EMOJI[a.type] || ''} ${ACT_TYPES[a.type] || esc(a.type)}</span></td><td data-label="Подробиці">${esc(a.text)}</td></tr>`).join('')}
  </tbody></table></div>${moreBtn(n, list.length, 'act')}<div class="table-foot"><span>Показано: ${n} з ${list.length}</span></div>`;
}

function exportActivity() {
  const list = filteredActivity(State.admin);
  if (!list.length) return toast('Немає що експортувати', 'warn');
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['Дата', 'Час', 'Учасник', 'Дія', 'Подробиці'], ...list.map(a => [a.date, fmtTime(a.time), a.nickname, ACT_TYPES[a.type] || a.type, a.text])];
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'activity-' + todayISO() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(`Експортовано подій: ${list.length}`);
}

/* ---------- картка учасника: деталі й історія дій ---------- */
function openUserDetail(id) {
  const A = State.admin, u = A && A.byId.get(String(id)); if (!u) return;
  const hunts = A.hunts.filter(h => huntOf(h, u)), acts = A.act.filter(a => String(a.userId) === String(u.id)), h = u.activeHunt;
  openModal({
    title: '👁️ Картка учасника', size: 'lg',
    body: `<div class="ud-head">${uAvatar(u)}<div><b style="font-size:18px">${esc(uName(u))}</b>${isMe(u) ? ' <span class="chip gold">Ви</span>' : ''}<div class="muted">${esc(uFull(u) || 'Ім’я не вказано')} · ${esc(u.login)}</div></div>
        <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap"><span class="chip ${u.role === 'admin' ? 'gold' : ''}">${u.role === 'admin' ? '🛡️ Адмін' : '🧑‍✈️ Користувач'}</span><span class="chip ${u.status === 'blocked' ? 'red' : 'green'}">${u.status === 'blocked' ? '⛔ Заблоковано' : '✅ Активний'}</span></div></div>
      <div class="ud-kpi"><div><span>Пошуків</span><b>${u.huntsCount}</b></div><div><span>Сума продажів</span><b class="gold">${fmtMoney(u.salesTotal)}</b></div><div><span>Продажів</span><b>${u.salesCount}</b></div><div><span>Подій у журналі</span><b>${u.activityCount != null ? u.activityCount : acts.length}</b></div></div>
      ${h ? `<div class="live-card"><div class="top"><span class="chip green">Пошук №${h.id} триває</span></div><small>🗺️ карти ${h.mapsUsed}/${h.mapsTotal} · 💸 витрати ${fmtMoney(h.expenses)} · 💰 дохід ${fmtMoney(h.income)}</small></div>` : ''}
      <h4 class="ud-h">🧭 Пошуки</h4>
      ${hunts.length ? `<div class="table-wrap"><table class="table mini"><thead><tr><th>Старт</th><th>Статус</th><th class="r">Карти</th><th class="r">Витрати</th><th class="r">Дохід</th><th class="r">Підсумок</th></tr></thead><tbody>${hunts.slice(0, 8).map(x => `<tr><td>${fmtDate(x.startDate)} ${fmtTime(x.startTime)}</td><td>${huntBadge(x)}</td><td class="r">${x.mapsUsed}/${x.mapsTotal}</td><td class="r">${fmtMoney(x.expenses)}</td><td class="r">${fmtMoney(x.income)}</td><td class="r ${tone(x.profit)}" style="font-weight:800">${signed(x.profit)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Пошуків ще не було.</p>'}
      <h4 class="ud-h">🕵️ Останні дії</h4>
      <div class="tl">${acts.slice(0, 40).map(a => tlItem(a, false)).join('') || '<p class="muted">Записів немає.</p>'}</div>`,
    actions: [
      { label: 'Закрити', kind: 'ghost', onClick: m => m.close() },
      { label: '🕵️ Увесь журнал', onClick: m => { m.close(); State.adm.au = String(u.id); State.adminTab = 'activity'; if (State.page === 'admin') renderAdmin($('#view')); } },
      { label: '✏️ Редагувати', kind: 'primary', onClick: m => { m.close(); openUserForm(u); } }
    ]
  });
}

/* ---------- створення / редагування акаунта ---------- */
function showCreds(login, pass) {
  openModal({
    title: '🔐 Дані для входу',
    body: `<div class="creds"><div class="kv" style="border-top:0"><span>Логін</span><b>${esc(login)}</b></div><div class="kv"><span>Пароль</span><b>${esc(pass)}</b></div></div><p class="hint">Передайте ці дані учаснику. Пароль більше не відображатиметься.</p>`,
    actions: [
      { label: '📋 Копіювати', kind: 'primary', onClick: async () => { try { await navigator.clipboard.writeText(`Логін: ${login}\nПароль: ${pass}`); toast('Скопійовано'); } catch (_) { toast('Не вдалося скопіювати, виділіть текст вручну', 'warn'); } } },
      { label: 'Готово', kind: 'ghost', onClick: m => m.close() }
    ]
  });
}

function openUserForm(u) {
  const isNew = !u, me = !!u && isMe(u);
  openModal({
    title: isNew ? '➕ Новий акаунт' : `✏️ ${uName(u)}`,
    body: `<div class="form-grid">
        <label class="field"><span>Логін для входу</span><input class="input" id="ufLogin" maxlength="40" autocomplete="off" ${me ? 'disabled' : ''} value="${esc(u ? u.login : '')}"></label>
        <label class="field"><span>Нікнейм (публічний)</span><input class="input" id="ufNick" maxlength="60" value="${esc(u ? u.nickname : '')}"></label>
        <label class="field"><span>Ім’я</span><input class="input" id="ufFirst" maxlength="60" value="${esc(u ? u.firstName : '')}"></label>
        <label class="field"><span>Прізвище</span><input class="input" id="ufLast" maxlength="60" value="${esc(u ? u.lastName : '')}"></label>
        <label class="field"><span>Роль</span><select class="input" id="ufRole" ${me ? 'disabled' : ''}><option value="user" ${!u || u.role === 'user' ? 'selected' : ''}>🧑‍✈️ Користувач</option><option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>🛡️ Адміністратор</option></select></label>
        <label class="field"><span>Статус</span><select class="input" id="ufStatus" ${me ? 'disabled' : ''}><option value="active" ${!u || u.status === 'active' ? 'selected' : ''}>✅ Активний</option><option value="blocked" ${u && u.status === 'blocked' ? 'selected' : ''}>⛔ Заблокований</option></select></label>
      </div>
      <label class="field"><span>${isNew ? 'Пароль' : 'Новий пароль (необов’язково)'}</span>
        <div class="input-affix pw"><input class="input" id="ufPass" type="text" autocomplete="new-password" placeholder="${isNew ? 'Мінімум 6 символів' : 'Залиште порожнім, щоб не змінювати'}"><button type="button" class="icon-btn" id="ufGen" title="Згенерувати пароль">🎲</button></div></label>`,
    actions: [
      { label: 'Скасувати', kind: 'ghost', onClick: m => m.close() },
      { label: isNew ? 'Створити акаунт' : 'Зберегти', kind: 'primary', onClick: (m, btn) => guard(btn, async () => {
          const val = id => $('#' + id, m.el).value.trim();
          const data = { login: me ? u.login : val('ufLogin'), nickname: val('ufNick'), firstName: val('ufFirst'), lastName: val('ufLast'), role: me ? u.role : $('#ufRole', m.el).value, status: me ? u.status : $('#ufStatus', m.el).value };
          const pass = $('#ufPass', m.el).value;
          if (data.login.length < 3) { toast('Логін має містити щонайменше 3 символи', 'warn'); return; }
          if (!data.nickname) data.nickname = data.login;
          if (isNew) {
            if (pass.length < 6) { toast('Пароль має містити щонайменше 6 символів', 'warn'); return; }
            await adminApi('adminCreateUser', { ...data, password: pass });
            m.close(); toast('Акаунт створено'); burst('🎉');
            showCreds(data.login, pass);
          } else {
            const diff = {};
            ['login', 'nickname', 'firstName', 'lastName', 'role', 'status'].forEach(k => { if (String(u[k] ?? '') !== data[k]) diff[k] = data[k]; });
            if (pass) { if (pass.length < 6) { toast('Пароль має містити щонайменше 6 символів', 'warn'); return; } diff.password = pass; }
            if (!Object.keys(diff).length) { toast('Змін немає', 'warn'); return; }
            await adminApi('adminUpdateUser', { id: u.id, ...diff });
            m.close(); toast('Дані користувача оновлено');
            if (diff.password) showCreds(data.login, pass);
          }
          if (State.page === 'admin') drawAdmin(true);
        }) }
    ],
    onMount: m => { $('#ufGen', m.el).onclick = () => { $('#ufPass', m.el).value = genPass(); }; }
  });
}

async function adminToggleBlock(id) {
  const u = State.admin.byId.get(String(id)); if (!u || isMe(u)) return;
  const to = u.status === 'blocked' ? 'active' : 'blocked';
  if (to === 'blocked' && !(await confirmModal({ title: 'Заблокувати акаунт?', text: `<b>${esc(uName(u))}</b> не зможе увійти на сайт, доки ви його не розблокуєте.`, ok: 'Заблокувати', kind: 'danger' }))) return;
  await guard(null, async () => {
    await adminApi('adminUpdateUser', { id: u.id, status: to });
    toast(to === 'blocked' ? 'Акаунт заблоковано' : 'Акаунт розблоковано');
    if (State.page === 'admin') drawAdmin(false);
  });
}

async function adminFinish(id) {
  const h = State.admin.hunts.find(x => Number(x.id) === id); if (!h) return;
  const ready = h.finish.canFinish;
  const ok = await confirmModal({
    title: ready ? 'Завершити пошук?' : 'Завершити примусово?',
    text: ready ? `Пошук №${h.id} користувача <b>${esc(h.nickname)}</b> готовий до завершення.`
      : `Пошук №${h.id} користувача <b>${esc(h.nickname)}</b> ще не готовий: ${h.finish.reasons.map(esc).join('; ')}. Примусове завершення закриє пошук, непродані предмети буде втрачено з обліку.`,
    ok: ready ? 'Завершити' : 'Завершити примусово', kind: ready ? 'primary' : 'danger'
  });
  if (!ok) return;
  await guard(null, async () => {
    const d = await api('finishHunt', { huntId: id, force: !ready });
    applyState(d.state, { render: false });
    await loadAdmin(true); toast('Пошук завершено');
    if (State.page === 'admin' && $('#adBody')) drawAdmin(false);
  });
}

/* ==========================================================
   INIT
   ========================================================== */
function bindGlobal() {
  $('#loginForm').addEventListener('submit', doLogin);
  $('#pwToggle').onclick = () => { const i = $('#passInput'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#logoutBtn').onclick = logout;
  $('#burger').onclick = () => { $('#sidebar').classList.add('open'); document.body.classList.add('nav-open'); };
  $('#scrim').onclick = closeSidebar;
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Live.kick(); });
  window.addEventListener('online', () => Live.kick());
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) return navigate(g.dataset.go);
    const o = e.target.closest('[data-open]');
    if (o && !o.disabled && State.boot && OPEN[o.dataset.open]) OPEN[o.dataset.open](o);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  loadPrefs();
  buildShell();
  bindGlobal();
  AC.init();
  FX.init();
  resumeSession();
});


</script>
</body>
