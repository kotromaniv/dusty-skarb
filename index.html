<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06121a">
<title>Treasure Ledger — облік скарбів</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#12100d; --bg2:#1a1712; --card:#201c15; --card2:#28231a; --line:#382f22;
  --text:#efe6d2; --muted:#a09479; --gold:#e0b04a; --gold-d:#b98a2a;
  --green:#5fbf8a; --red:#e0666e; --blue:#6aa4d8;
  --r:12px; --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
b{font-weight:700}
.ic{flex:none;vertical-align:middle}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* helpers */
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:var(--red)} .gold{color:var(--gold)}
.mb{margin-bottom:16px} .mt{margin-top:16px}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.r{text-align:right}

/* boot / loader */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.is-loading::before{content:"";position:fixed;top:0;left:0;height:3px;width:40%;background:var(--gold);z-index:300;animation:bar 1s ease-in-out infinite}
@keyframes bar{0%{left:-40%}100%{left:100%}}

/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:22px}
.brand span{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#241a06;display:grid;place-items:center}
.auth-err{background:rgba(224,102,110,.12);border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:14px}
.auth-card .btn{width:100%;justify-content:center}

/* shell */
#app{min-height:100vh}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:60;overflow-y:auto}
#sidebar .brand{padding:0 8px}
#nav{flex:1}
.nav-group{font-size:12px;color:var(--muted);padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);margin-bottom:2px}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--card2);color:var(--gold)}
.nav-item.live::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:auto;box-shadow:0 0 0 3px rgba(95,191,138,.2)}
.side-user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 6px 0;margin-top:10px}
.side-user b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sideAvatar,.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#241a06;display:grid;place-items:center;font-weight:800;flex:none}
.avatar{width:72px;height:72px;font-size:24px;margin:0 auto 12px}
#scrim{display:none}
.main{margin-left:250px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:40}
.topbar h2{font-size:15px;font-weight:600;color:var(--muted)}
#burger{display:none}
#view{padding:26px 28px 60px;max-width:1240px}
#view.enter{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.no-anim *,.no-anim *::before{animation:none!important;transition:none!important}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;letter-spacing:-.01em}
.page-head p{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions.between{justify-content:space-between;align-items:center}
.page-head .actions{margin:0}

/* cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:16px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px;margin-bottom:18px}
.grid>.card{margin-bottom:0}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.two{grid-template-columns:1fr 1fr}
.grid.cols2{grid-template-columns:1fr 1fr}
.grid.top{align-items:start}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.stat-ico{width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center}
.stat-ico.gold{color:var(--gold)} .stat-ico.green{color:var(--green)} .stat-ico.red{color:var(--red)} .stat-ico.blue{color:var(--blue)}
.stat-val{font-size:26px;font-weight:800;margin:10px 0 4px}
.stat-sub{color:var(--muted);font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--gold-d)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241a06}
.btn.primary:hover{background:#ecc064}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(224,102,110,.14);border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.is-busy{opacity:.7;pointer-events:none}
.icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip.green{color:var(--green);border-color:rgba(95,191,138,.4);background:rgba(95,191,138,.1)}
.chip.gold{color:var(--gold);border-color:rgba(224,176,74,.4);background:rgba(224,176,74,.1)}
.chip.warn{color:var(--gold);border-color:var(--gold-d);cursor:pointer}
a.chip:hover{border-color:var(--gold)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--muted)}
.field.grow{flex:1;min-width:200px}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--text)}
.input:focus{border-color:var(--gold);outline:none}
.input.sm{padding:5px 8px;font-size:13px;width:auto}
select.input{cursor:pointer}
.input-affix{position:relative;display:flex;align-items:center}
.input-affix>i{position:absolute;left:12px;color:var(--muted);font-style:normal;display:flex;pointer-events:none}
.input-affix .input{padding-left:30px}
.input-affix.pw .input{padding-left:12px;padding-right:42px}
.input-affix.pw .icon-btn{position:absolute;right:4px}
.static{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.filters{display:flex;flex-wrap:wrap;gap:0 14px;align-items:flex-end}
.filters .field{margin-bottom:0}
.filters .btn{margin-bottom:0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.seg button.on{background:var(--gold);color:#241a06}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch input:checked+i{background:var(--gold)}
.switch input:checked+i::after{transform:translateX(20px);background:#241a06}
.switch-row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.switch-row:first-of-type{border-top:0}
.switch-row p{color:var(--muted);font-size:13px}

/* tables */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table th.r,.table td.r{text-align:right}
.table tbody tr:last-child td{border-bottom:0}
.table.mini td,.table.mini th{padding:9px 16px}
.table tr.click{cursor:pointer}
.table tr.click:hover,.table tr.sel{background:var(--card2)}
.table tr.me{background:rgba(224,176,74,.08)}
body.compact .table td,body.compact .table th{padding-top:6px;padding-bottom:6px}
.cell-main{font-weight:600}
.cell-sub{color:var(--muted);font-size:12.5px;font-weight:400}
.table-foot{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line);color:var(--muted);background:var(--card2)}
.table-foot b{color:var(--text)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 20px;color:var(--muted);text-align:center}
.empty b{color:var(--text)}

/* hunt hero */
.hunt-hero{border-color:rgba(224,176,74,.45);background:linear-gradient(180deg,#261f12,var(--card))}
.hh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-weight:700}
.live i{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,191,138,.6)}100%{box-shadow:0 0 0 10px rgba(95,191,138,0)}}
.hh-main{display:grid;grid-template-columns:1.1fr 1.4fr;gap:26px}
.hh-val{font-size:38px;font-weight:800;margin:4px 0 10px}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.progress.ok i{background:var(--green)}
.hh-note{margin-top:10px;color:var(--muted);font-size:13.5px}
.hh-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hh-metrics>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.hh-metrics span{color:var(--muted);font-size:12.5px}
.hh-metrics b{font-size:20px}
.hh-metrics small{color:var(--muted);font-size:12px}
.start-card{text-align:center;max-width:640px;margin:0 auto 18px;padding:32px}
.start-ic{width:64px;height:64px;border-radius:50%;background:var(--card2);color:var(--gold);display:grid;place-items:center;margin:0 auto 14px}
.start-card h2{margin-bottom:8px}
.rules{list-style:none;padding:0;margin:18px 0;text-align:left;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.rules .ic{color:var(--green);margin-top:2px}
.finish-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.finish-card .chip{white-space:normal}

/* reports */
.rep{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px}
.rep.ok>.ic{color:var(--gold)} .rep.failed>.ic{color:var(--red)}
.rep p{margin-top:4px}
.rep-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tr-list{margin:6px 0 0;padding-left:20px}
.tr-card.failed{opacity:.85}
.tr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tr-title{display:flex;align-items:center;gap:8px;font-weight:700}
.tr-title .ti{color:var(--gold);display:flex}
.tr-card.failed .ti{color:var(--red)}
.tr-when{color:var(--muted);font-size:13px}
.tr-total{margin-left:auto;font-weight:800;font-size:18px}
.tr-log{margin-bottom:12px}

/* expense editor */
.ex-head,.ex-row{display:grid;grid-template-columns:1.5fr 90px 130px 90px 32px;gap:10px;align-items:center}
.ex-head{color:var(--muted);font-size:12.5px;padding-bottom:6px}
.ex-row{padding:6px 0;border-top:1px solid var(--line)}
.ex-name .req{color:var(--gold);font-size:11.5px;font-style:normal;margin-left:6px}
.ex-sum{text-align:right;font-weight:600}
.ex-add{padding:10px 0}
.row-total{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.row-total b{color:var(--gold)}

/* draft (finds) */
.irow{display:grid;grid-template-columns:1fr 80px 190px 32px;gap:10px;align-items:center;margin-bottom:8px}
.iprice{font-size:13px;color:var(--muted)}
.iprice b{color:var(--text)}
.tfoot{display:flex;gap:18px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);color:var(--muted)}
.tfoot b{color:var(--text)} .tfoot b.gold{color:var(--gold)}
.item-info{color:var(--muted);font-size:13px;min-height:20px;margin:-6px 0 12px}
.sale-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:18px}
.tg-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);color:var(--muted);font-size:13.5px}
.tg-note.on{border-color:var(--gold);color:var(--text);background:rgba(224,176,74,.08)}
.tg-note .ic{color:var(--gold)}

/* calculator */
.calc-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sum-card span{color:var(--muted);font-size:13px;display:block}
.sum-card b{font-size:24px}
.sum-card.profit{border-color:rgba(224,176,74,.45)}

/* chart */
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.chart text.val{fill:var(--text);font-size:10.5px}
.chart .xl{fill:var(--text);font-weight:600}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .zero-l{stroke:var(--muted);stroke-width:1}
.chart .selbg{fill:transparent}
.chart .day.sel .selbg,.chart .day:hover .selbg{fill:rgba(224,176,74,.08)}
.chart .hit{fill:transparent;cursor:pointer}
.bar-in{fill:var(--green)} .bar-ex{fill:var(--red)} .bar-pos{fill:var(--gold)} .bar-neg{fill:#a04a52}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:190px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip div{display:flex;justify-content:space-between;gap:16px}
.tip em{font-style:normal;font-weight:700}
.tip small{display:block;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:18px;margin-top:10px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.week-nav{display:flex;align-items:center;gap:6px}
.week-label{font-weight:700;min-width:150px;text-align:center}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end;margin-bottom:18px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 14px;text-align:center}
.pod.p1{padding-top:34px;padding-bottom:34px;border-color:var(--gold)}
.pod.me{background:rgba(224,176,74,.09)}
.pod-empty{min-height:1px}
.medal{font-size:34px}
.nick{font-weight:700;margin:6px 0 2px}
.amt{font-size:22px;font-weight:800;color:var(--gold)}
.cnt{color:var(--muted);font-size:13px}
.me-tag{margin-left:8px}
.rank-num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card2);font-weight:700}

/* profile / admin */
.profile-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.id-card{text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.kv span{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:400;max-width:calc(100vw - 36px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--green);padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.in{opacity:1;transform:none}
.toast.warn{border-left-color:var(--gold)}
.toast .ti{display:flex;color:var(--green)} .toast.warn .ti{color:var(--gold)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:200;opacity:0;transition:opacity .18s}
.modal-back.in{opacity:1}
.modal{width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.lg{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}

/* autocomplete */
.ac{position:fixed;z-index:500;background:var(--card2);border:1px solid var(--gold-d);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-height:300px;overflow-y:auto}
.ac-opt{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 12px;cursor:pointer}
.ac-opt:hover,.ac-opt.on{background:var(--line)}
.ac-sub{color:var(--muted);font-size:12px}
.ac-right{color:var(--gold);font-weight:700;font-size:13px}
.ac mark{background:transparent;color:var(--gold);font-weight:800}

/* responsive */
@media (max-width:980px){
  .hh-main,.grid.two,.grid.cols2,.profile-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  #sidebar{transform:translateX(-100%);transition:transform .22s;width:270px}
  #sidebar.open{transform:none}
  #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open #scrim{opacity:1;pointer-events:auto}
  .main{margin-left:0}
  #burger{display:inline-grid}

/* ================= THEME v2: Treasure Island ================= */
:root{
  --bg:#06121a;--bg2:#0a1c26;--card:#0f2734;--card2:#143444;--line:#1d4456;
  --text:#f6edd6;--muted:#8fb0b3;--gold:#ffc94a;--gold-d:#d99a1c;
  --green:#4fe0a0;--red:#ff6b7a;--blue:#5cc8ff;--purple:#b58cff;
  --glow:0 0 0 1px rgba(255,201,74,.3),0 12px 40px -12px rgba(255,201,74,.45);
  --font:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --display:'Philosopher',Georgia,'Times New Roman',serif;
}
*{scrollbar-width:thin;scrollbar-color:#1d4456 transparent}
::selection{background:rgba(255,201,74,.35)}
body{background:
  radial-gradient(900px 520px at 88% -8%,rgba(255,201,74,.12),transparent 60%),
  radial-gradient(800px 500px at -8% 105%,rgba(92,200,255,.12),transparent 60%),
  linear-gradient(180deg,#07141d,#050e14);background-attachment:fixed}
#app,#auth{position:relative;z-index:1}
button.chip{cursor:pointer;font:inherit;font-size:12.5px}

/* keyframes */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes floatup{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.3}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@keyframes lid{0%,55%,100%{transform:rotate(0)}70%{transform:rotate(-9deg)}85%{transform:rotate(-3deg)}}
@keyframes coinpop{0%,55%,100%{opacity:0;transform:translateY(8px) scale(.6)}72%{opacity:1;transform:translateY(-6px) scale(1)}90%{opacity:0;transform:translateY(-16px) scale(.8)}}
@keyframes logo{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}

/* floating treasure particles */
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;bottom:-40px;opacity:0;animation:floatup linear infinite;filter:drop-shadow(0 0 6px rgba(255,201,74,.5))}
.no-anim .fx,.no-anim .burst{display:none}
.burst{position:fixed;left:50%;top:38%;z-index:600;pointer-events:none}
.burst span{position:absolute;left:0;top:0;font-size:26px}

/* boot */
#boot{background:radial-gradient(500px 300px at 50% 45%,rgba(255,201,74,.16),transparent 70%),var(--bg)}
.boot-in{display:grid;place-items:center;gap:18px}
.boot-e{font-size:60px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,201,74,.6))}

/* auth */
#auth{padding:0;display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;place-items:stretch}
.auth-hero{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;overflow:hidden;background:radial-gradient(600px 420px at 50% 42%,rgba(255,201,74,.2),transparent 65%),linear-gradient(160deg,#0b2a38,#06121a)}
.auth-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,201,74,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,201,74,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 15%,transparent 75%);mask-image:radial-gradient(circle at 50% 45%,#000 15%,transparent 75%)}
.auth-hero>*{position:relative}
.chest{width:min(320px,70%);height:auto;filter:drop-shadow(0 22px 40px rgba(0,0,0,.55));animation:bob 4s ease-in-out infinite}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;animation:lid 4s ease-in-out infinite}
.chest .pop{animation:coinpop 4s ease-in-out infinite}
.chest .pop.d2{animation-delay:.25s}.chest .pop.d3{animation-delay:.5s}
.auth-hero h2{font-family:var(--display);font-size:32px;letter-spacing:.06em;margin-top:20px;text-align:center;background:linear-gradient(90deg,#fff2c2,#ffc94a 50%,#e58e1a);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-hero p{color:var(--muted);max-width:380px;text-align:center;margin-top:8px}
.auth-feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.auth-feats span{padding:6px 14px;border-radius:99px;background:rgba(255,201,74,.08);border:1px solid rgba(255,201,74,.25);font-size:13.5px}
.auth-side{display:grid;place-items:center;padding:24px}
.auth-card{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--card);box-shadow:var(--glow);animation:rise .6s both}
.auth-card .brand{margin-bottom:6px}
.auth-sub{color:var(--muted);margin-bottom:20px;font-size:14px}
@media(max-width:880px){#auth{grid-template-columns:1fr}.auth-hero{display:none}}

/* brand / sidebar */
.brand span{width:auto;height:auto;background:none;border-radius:0;display:grid}
.brand svg{filter:drop-shadow(0 0 8px rgba(255,201,74,.55));animation:logo 7s ease-in-out infinite}
.brand b{font-family:var(--display);letter-spacing:.08em;color:var(--gold);font-size:17px}
#sidebar{background:linear-gradient(180deg,#0b2230,#07151d);border-right:1px solid rgba(255,201,74,.16)}
.nav-group{letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.nav-item{position:relative;transition:background .2s,color .2s,transform .2s}
.nav-item:hover{transform:translateX(3px)}
.nav-item.active{background:linear-gradient(90deg,rgba(255,201,74,.16),rgba(255,201,74,.02));color:var(--gold)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.ne{font-size:18px;width:24px;text-align:center;transition:transform .25s}
.nav-item:hover .ne,.nav-item.active .ne{transform:scale(1.2) rotate(-6deg)}
#sideAvatar{background:linear-gradient(135deg,#ffe08a,#d99a1c);box-shadow:0 0 0 2px rgba(255,201,74,.35)}
.topbar{background:rgba(6,18,26,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.topbar h2{color:var(--text);font-family:var(--display);letter-spacing:.05em}

/* headings */
.page-head h1{font-family:var(--display);font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.h-e{display:inline-block;animation:bob 3s ease-in-out infinite;font-size:.9em}
.h-t{background:linear-gradient(90deg,#fff2c2,#ffc94a 45%,#e58e1a);-webkit-background-clip:text;background-clip:text;color:transparent}

/* cards & entrance */
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 60%),var(--card);box-shadow:0 10px 30px -16px rgba(0,0,0,.8);transition:transform .25s,border-color .25s,box-shadow .25s}
.stat:hover,.live-card:hover{transform:translateY(-3px);border-color:rgba(255,201,74,.5);box-shadow:var(--glow)}
#view.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(5){animation-delay:.2s}
#view.enter .grid.stats>.card{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#view.enter .grid.stats>.card:nth-child(2){animation-delay:.06s}#view.enter .grid.stats>.card:nth-child(3){animation-delay:.12s}
#view.enter .grid.stats>.card:nth-child(4){animation-delay:.18s}#view.enter .grid.stats>.card:nth-child(5){animation-delay:.24s}
#view.enter .grid.stats>.card:nth-child(6){animation-delay:.3s}#view.enter .grid.stats>.card:nth-child(7){animation-delay:.36s}
.stat-val{font-family:var(--font);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0}
.stat-ico{background:rgba(255,255,255,.05)}
.table tbody tr{transition:background .15s}
.table tbody tr:hover td{background:rgba(255,201,74,.045)}
.more{text-align:center;padding:12px}

/* buttons */
.btn{transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:none}
.btn.primary{background:linear-gradient(180deg,#ffdc7a,#ffc94a 55%,#e5a022);box-shadow:0 8px 20px -8px rgba(255,201,74,.7);position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.btn.primary:hover::after{transform:translateX(130%);transition:transform .7s}
.chip.red{color:var(--red);border-color:rgba(255,107,122,.4);background:rgba(255,107,122,.1)}
.chip.blue{color:var(--blue);border-color:rgba(92,200,255,.4);background:rgba(92,200,255,.1)}

/* hunt hero */
.hunt-hero{position:relative;overflow:hidden;background:radial-gradient(600px 240px at 100% 0,rgba(255,201,74,.18),transparent 60%),linear-gradient(180deg,#163444,#0f2734);border-color:rgba(255,201,74,.5);box-shadow:var(--glow)}
.hunt-hero::after{content:"🧭";position:absolute;right:14px;bottom:-18px;font-size:130px;opacity:.07;animation:spin 60s linear infinite;pointer-events:none}
.hh-val{font-family:var(--font);font-variant-numeric:tabular-nums}
.progress i{background:linear-gradient(90deg,#d99a1c,#ffc94a,#ffe9a3,#ffc94a,#d99a1c);background-size:200% 100%;animation:shine 3s linear infinite}
.progress.ok i{background:linear-gradient(90deg,#2fbf80,#4fe0a0,#a6ffd6,#4fe0a0,#2fbf80);background-size:200% 100%}
.start-ic{font-size:0;background:radial-gradient(circle,rgba(255,201,74,.25),transparent 70%);animation:bob 3s ease-in-out infinite}
.rep{transition:transform .2s,border-color .2s}
.rep.ok{border-color:rgba(255,201,74,.3)}
.rep:hover{transform:translateX(3px)}

/* podium */
.pod{transition:transform .25s}
.pod:hover{transform:translateY(-4px)}
.pod.p1{box-shadow:var(--glow);background:linear-gradient(180deg,rgba(255,201,74,.12),var(--card))}
.pod.p1 .medal{animation:bob 2.4s ease-in-out infinite}

/* modal & toast */
.modal-back{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{transform:translateY(16px) scale(.97);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--glow)}
.modal-back.in .modal{transform:none}
.toast{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* skeleton */
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--card2),#1f4b5e,var(--card2));background-size:200% 100%;animation:shine 1.3s linear infinite;margin:12px 0}

/* admin */
.user-cell{display:flex;align-items:center;gap:10px;text-align:left}
.uav{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffe08a,#d99a1c);color:#241a06;font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}
.row-actions{display:inline-flex;gap:2px}
.row-actions .icon-btn{font-size:16px}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.live-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;transition:transform .25s,border-color .25s,box-shadow .25s}
.live-card .top{display:flex;align-items:center;gap:10px}
.live-card small{color:var(--muted)}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rank-row:first-child{border-top:0}
.rank-row b.gold{margin-left:auto}
.tl{display:grid}
.tl-i{display:flex;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line);align-items:flex-start}
.tl-i:last-child{border-bottom:0}
.tl-e{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;font-size:16px}
.tl-i small{color:var(--muted);display:block}
.modal .tl{max-height:300px;overflow-y:auto}
.ud-head{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.ud-head .uav{width:52px;height:52px;font-size:18px}
.ud-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.ud-kpi>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ud-kpi span{display:block;color:var(--muted);font-size:12px}
.ud-kpi b{font-size:17px}
.ud-h{margin:18px 0 6px;font-size:14px;color:var(--muted)}
.toolbar-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.summary-line{padding:12px 16px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.creds .kv b{font-family:monospace;font-size:16px;user-select:all}
.input-affix.pw .icon-btn{font-size:16px}

@media (prefers-reduced-motion:reduce){.fx,.burst{display:none}}

/* ===== v3: продаж, шкала графіка, дрібні виправлення ===== */
.sl-head,.sl-row{display:grid;grid-template-columns:1.4fr 1.3fr 72px 116px 92px;gap:10px;align-items:center}
.sl-head{color:var(--muted);font-size:12.5px;padding:0 0 6px}
.sl-row{padding:9px 0;border-top:1px solid var(--line);transition:opacity .2s}

.sl-name small{display:block;color:var(--muted);font-size:12px}
.sl-sum{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sl-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

@media (max-width:820px){
  .sl-head{display:none}
  .sl-row{grid-template-columns:1fr 1fr}
  .sl-name{grid-column:1/-1}
  .sl-sum{text-align:left}
}

class ApiError extends Error { constructor(m, d = {}) { super(m); this.code = d.code; this.data = d; } }

const Loader = {
  n: 0,
  show() { this.n++; document.body.classList.add('is-loading'); },
  hide() { this.n = Math.max(0, this.n - 1); if (!this.n) document.body.classList.remove('is-loading'); }

const MUTATING = new Set(['updateProfile', 'addItem', 'updateItem', 'startHunt', 'finishHunt', 'addTreasure', 'addSale', 'addSales', 'addExpense', 'adminUpdateUser', 'adminCreateUser', 'adminDeleteUser']);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const newRid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);

async function api(action, payload = {}, { silent = false, retry = true } = {}) {
  if (/ВАШ_|YOUR_/.test(CONFIG.API_URL)) throw new ApiError('Вкажіть адресу Apps Script (API_URL) у CONFIG всередині index.html');
  if (!silent) Loader.show();
  try {
    const mut = MUTATING.has(action);
    // зміни повторюємо лише коли сервер вміє відсікати дублікати (rid); читання повторюємо завжди
    const canRetry = retry && (!mut || !!(State.boot && State.boot.config && State.boot.config.idempotent));
    const body = JSON.stringify({ action, token: State.token, rid: mut ? newRid() : undefined, ...payload });
    let res, attempt = 0;
    for (;;) {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 35000);
      try { res = await fetch(CONFIG.API_URL, { method: 'POST', redirect: 'follow', body, signal: ctl.signal }); clearTimeout(tm); break; }
      catch (e) {
        clearTimeout(tm);
        if (canRetry && attempt < 2) { attempt++; await sleep(450 * attempt); continue; }
        throw new ApiError(e && e.name === 'AbortError' ? 'Сервер не відповів вчасно. Спробуйте ще раз.' : 'Немає зв’язку із сервером. Перевірте інтернет і адресу API.');
      }
    }
    let json;
    try { json = await res.json(); } catch (e) { throw new ApiError('Сервер повернув некоректну відповідь. Перевірте розгортання Apps Script.'); }
    if (!json.success) {
      if (json.code === 'AUTH' && State.token) forceLogout(json.error);
      throw new ApiError(json.error || 'Помилка запиту', json);
    }
    return json.data;
  } finally { if (!silent) Loader.hide(); }
}

function openModal({ title, body = '', actions = [], size = '', onMount, onClose }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true"><header class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-x aria-label="Закрити">${icon('x', 18)}</button></header><div class="modal-b">${body}</div>${actions.length ? '<footer class="modal-f"></footer>' : ''}</div>`;
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && $('#modalRoot').lastElementChild === back) close(); };
  function close() {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', onKey);
    back.classList.remove('in');
    setTimeout(() => back.remove(), 180);
    onClose && onClose();
  }
  const m = { el: back.querySelector('.modal'), back, close };
  const foot = $('.modal-f', back);
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.kind || '');
    b.textContent = a.label;
    b.addEventListener('click', () => a.onClick && a.onClick(m, b));
    foot.appendChild(b);
  });
  $('[data-x]', back).onclick = close;
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  $('#modalRoot').appendChild(back);
  requestAnimationFrame(() => back.classList.add('in'));
  onMount && onMount(m);
  const first = $('input:not([type=hidden]):not([type=checkbox])', m.el);
  if (first) setTimeout(() => first.focus(), 60);
  return m;
}

/* ==========================================================
   AUTOCOMPLETE (підказки предметів при введенні)
   ========================================================== */
const AC = {
  box: null, input: null, list: [], idx: -1, silent: false,
  init() {
    this.box = document.createElement('div');
    this.box.className = 'ac'; this.box.hidden = true;
    document.body.appendChild(this.box);
    document.addEventListener('input', e => { if (!this.silent && e.target.matches && e.target.matches('[data-ac]')) this.show(e.target); });
    document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-ac="stock"]')) this.show(e.target); });
    document.addEventListener('keydown', e => this.key(e), true);
    document.addEventListener('mousedown', e => { if (!this.box.contains(e.target) && e.target !== this.input) this.hide(); });
    window.addEventListener('resize', () => this.hide());
    document.addEventListener('scroll', e => { if (!this.box.hidden && !this.box.contains(e.target)) this.place(); }, true);
    this.box.addEventListener('mousedown', e => {
      const o = e.target.closest('.ac-opt'); if (!o) return;
      e.preventDefault(); this.pick(+o.dataset.i);
    });
  },
  source(kind) {
    if (kind === 'stock') return (State.boot.activeHunt?.stock || []).map(s => ({ name: s.name, sub: s.category, right: 'x' + s.qty }));
    return State.boot.items.map(i => ({ name: i.name, sub: i.category, right: fmtMoney(i.price) }));
  },
  rank(list, q) {
    if (!q) return list.slice(0, 8);
    const out = [];
    list.forEach(o => {
      const n = norm(o.name);
      const s = n.startsWith(q) ? 0 : n.split(' ').some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : -1;
      if (s >= 0) out.push({ o, s });
    });
    out.sort((a, b) => a.s - b.s || a.o.name.localeCompare(b.o.name));
    return out.slice(0, 8).map(x => x.o);
  },
  hl(name, q) {
    const i = q ? name.toLowerCase().indexOf(q) : -1;
    return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
  },
  show(input) {
    this.input = input;
    const q = norm(input.value);
    if (!q && input.dataset.ac !== 'stock') return this.hide();
    const list = this.rank(this.source(input.dataset.ac), q);
    if (!list.length || (list.length === 1 && norm(list[0].name) === q)) return this.hide();
    this.list = list; this.idx = -1;
    this.box.innerHTML = list.map((o, i) => `<div class="ac-opt" data-i="${i}"><span class="ac-name">${this.hl(o.name, q)}</span><span class="ac-sub">${esc(o.sub || '')}</span><span class="ac-right">${esc(o.right || '')}</span></div>`).join('');
    this.box.hidden = false;
    this.place();
  },
  place() {
    if (!this.input || !this.input.isConnected) return this.hide();
    const r = this.input.getBoundingClientRect(), b = this.box;
    b.style.width = Math.max(r.width, 290) + 'px';
    b.style.left = Math.min(r.left, Math.max(8, window.innerWidth - b.offsetWidth - 8)) + 'px';
    const below = window.innerHeight - r.bottom;
    b.style.top = (below < b.offsetHeight + 16 && r.top > below ? r.top - b.offsetHeight - 6 : r.bottom + 6) + 'px';
  },
  hide() { this.box.hidden = true; this.idx = -1; },
  mark() { $$('.ac-opt', this.box).forEach((el, i) => el.classList.toggle('on', i === this.idx)); const on = $('.ac-opt.on', this.box); if (on) on.scrollIntoView({ block: 'nearest' }); },
  key(e) {
    if (this.box.hidden || e.target !== this.input) return;
    const n = this.list.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); this.idx = (this.idx + 1) % n; this.mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.idx = (this.idx - 1 + n) % n; this.mark(); }
    else if (e.key === 'Enter' && this.idx >= 0) { e.preventDefault(); e.stopPropagation(); this.pick(this.idx); }
    else if (e.key === 'Escape') { e.stopPropagation(); this.hide(); }
  },
  pick(i) {
    const o = this.list[i]; if (!o || !this.input) return;
    this.silent = true;
    this.input.value = o.name;
    this.input.dispatchEvent(new Event('input', { bubbles: true }));
    this.silent = false;
    this.hide();
    this.input.focus();
  }
};

   AUTH
   ========================================================== */
function showAuth(msg) {
  $('#boot').hidden = true; $('#app').hidden = true; $('#auth').hidden = false;
  const err = $('#authErr');
  err.hidden = !msg; err.textContent = msg || '';
}

async function doLogin(e) {
  e.preventDefault();
  const login = $('#loginInput').value.trim(), password = $('#passInput').value;
  await busy($('#loginBtn'), async () => {
    try {
      const d = await api('login', { login, password });
      State.token = d.token; State.profile = d.profile;
      try { localStorage.setItem(LS.token, d.token); } catch (_) {}
      $('#passInput').value = '';
      enterApp(d.state);
    } catch (err) { showAuth(err.message); }
  });
}

async function resumeSession() {
  const t = (() => { try { return localStorage.getItem(LS.token); } catch (_) { return null; } })();
  if (!t) return showAuth();
  State.token = t;
  const cached = readBootCache();
  if (cached && cached.profile) {
    enterApp(cached);
    api('getBootstrap', {}, { silent: true })
      .then(s => applyState(s, { render: $('#modalRoot').childElementCount === 0 }))
      .catch(e => { if (e.code !== 'AUTH') toast('Показано збережені дані: ' + e.message, 'warn'); });
    return;
  }
  try {
    enterApp(await api('getBootstrap', {}, { silent: true }));
  } catch (e) {
    if (e.code === 'AUTH') { State.token = null; try { localStorage.removeItem(LS.token); } catch (_) {} showAuth(); }
    else showAuth(e.message);
  }
}

function enterApp(state) {
  State.profile = state.profile;
  $('#boot').hidden = true; $('#auth').hidden = true; $('#app').hidden = false;
  buildNav();
  applyState(state, { render: false });
  ensureCalc();
  if (!location.hash) location.hash = '#/dashboard';
  route();
  Live.start();
}

function forceLogout(msg) { logout(); if (msg) toast(msg, 'warn'); }
function logout() {
  clearBootCache(); Live.stop();
  State.token = null; State.boot = null; State.profile = null; State.calc = null; State.admin = null;
  try { localStorage.removeItem(LS.token); } catch (_) {}
  location.hash = '';
  showAuth();
}

function applyState(s, { render = true, soft = false } = {}) {
  State.boot = s;
  State.itemIdx = new Map((s.items || []).map(i => [norm(i.name), i]));
  State.lastSync = Date.now();
  if (s.meta && s.meta.rev !== undefined) State.rev = { g: s.meta.rev, u: s.meta.urev };
  cacheBoot();
  if (s.profile) State.profile = s.profile;
  const st = State.stats;
  if (!soft) { st.data = s.statistics; st.mode = 'week'; st.sel = undefined; }
  else if (st.mode === 'week' && !(st.data && st.data.weekOffset)) st.data = s.statistics;   // не збиваємо вибраний період
  $('#sideNick').textContent = State.profile.nickname;
  $('#sideAvatar').textContent = initials(State.profile.nickname);
  const nav = $('[data-nav="hunt"]');
  if (nav) nav.classList.toggle('live', !!s.activeHunt);
  if (render) renderPage();
}

/* ==========================================================
   ГРАФІК (SVG, без бібліотек)
   ========================================================== */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
/** Шкала з «круглими» позначками; нуль завжди лежить на лінії сітки. */
function chartScale(all) {
  const mx0 = Math.max(0, ...all), mn0 = Math.min(0, ...all);
  if (mx0 === 0 && mn0 === 0) return { mn: 0, mx: 100, step: 25, empty: true };
  const step = niceStep((mx0 - mn0) / 4);
  return { mn: Math.floor(mn0 / step + 1e-9) * step, mx: Math.ceil(mx0 / step - 1e-9) * step, step, empty: false };
}

function chartSVG(days, series = 'both', sel = null) {
  const W = 720, H = 300, pl = 54, pr = 12, pt = 24, pb = 42, iw = W - pl - pr, ih = H - pt - pb, n = Math.max(1, days.length);
  const valsOf = d => series === 'both' ? [d.income, d.expenses] : series === 'income' ? [d.income] : series === 'expenses' ? [d.expenses] : [d.profit];
  const sc = chartScale(days.flatMap(valsOf)), mn = sc.mn, mx = sc.mx;
  const span = mx - mn, y = v => pt + ih * (mx - v) / span, y0 = y(0);
  const stepX = iw / n, m = series === 'both' ? 2 : 1, gap = stepX > 16 ? 3 : 1;
  const bw = Math.max(1.5, Math.min(m === 2 ? 26 : 40, (stepX * 0.78 - gap * (m - 1)) / m));
  const showVals = n <= 10;
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік по днях">`;
  const ticks = Math.round(span / sc.step);
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round((mn + sc.step * i) * 100) / 100, yy = y(v);
    out += `<line class="${v === 0 ? 'zero-l' : 'grid-l'}" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtShort(v)}</text>`;
  }
  if (sc.empty) out += `<text class="empty-l" x="${W / 2}" y="${pt + ih / 2}" text-anchor="middle">Даних за цей період немає</text>`;
  const every = Math.ceil(n / 12);
  days.forEach((d, i) => {
    const cx = pl + stepX * i + stepX / 2;
    out += `<g class="day ${sel === d.date ? 'sel' : ''}" data-i="${i}">
      <rect class="selbg" x="${cx - stepX / 2}" y="${pt}" width="${stepX}" height="${ih}"/>`;
    valsOf(d).forEach((v, k) => {
      const cls = series === 'profit' ? (v >= 0 ? 'bar-pos' : 'bar-neg') : (series === 'both' ? (k === 0 ? 'bar-in' : 'bar-ex') : (series === 'income' ? 'bar-in' : 'bar-ex'));
      const x = cx - (m * bw + (m - 1) * gap) / 2 + k * (bw + gap);
      const top = v >= 0 ? y(v) : y0, h = Math.max(v === 0 ? 0 : 2, Math.abs(y(v) - y0));
      if (v !== 0) out += `<rect class="${cls}" x="${x}" y="${top}" width="${bw}" height="${h}" rx="${bw > 6 ? 3 : 1}"/>`;
      if (showVals && v !== 0) out += `<text class="val" x="${x + bw / 2}" y="${v >= 0 ? top - 5 : top + h + 12}" text-anchor="middle">${fmtShort(v)}</text>`;
    });
    if (n <= 10) out += `<text x="${cx}" y="${H - 22}" text-anchor="middle" class="xl">${WEEKDAYS_SHORT[d.weekday]}</text><text x="${cx}" y="${H - 8}" text-anchor="middle" class="xs">${fmtDateShort(d.date)}</text>`;
    else if (i % every === 0) out += `<text x="${cx}" y="${H - 14}" text-anchor="middle" class="xs">${fmtDateShort(d.date)}</text>`;
    out += `<rect class="hit" x="${cx - stepX / 2}" y="${pt}" width="${stepX}" height="${ih + pb - 8}"/></g>`;
  });
  return out + '</svg>';
}

function chartLegend(series) {
  const L = { income: ['var(--green)', 'Дохід'], expenses: ['var(--red)', 'Витрати'], pos: ['var(--gold)', 'Прибуток'], neg: ['#a04a52', 'Збиток'] };
  const items = series === 'both' ? [L.income, L.expenses] : series === 'income' ? [L.income] : series === 'expenses' ? [L.expenses] : [L.pos, L.neg];
  return `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
}

function dayTipHTML(d) {
  return `<b>${WEEKDAYS[d.weekday]}, ${fmtDate(d.date)}</b>

    <div><span>Прибуток</span><em class="${tone(d.profit)}">${signed(d.profit)}</em></div>
    <small>Продажі: ${d.salesCount}, скарби: ${d.treasuresCount}${d.failedCount ? `, невдалі карти: ${d.failedCount}` : ''}</small>`;
}

function bindChart(wrap, days, onSelect) {
  if (!wrap) return;
  const tip = $('.tip', wrap);
  const showTip = (e, g) => {
    const d = days[+g.dataset.i]; if (!d) return;
    tip.innerHTML = dayTipHTML(d); tip.hidden = false;
    const r = wrap.getBoundingClientRect();
    let x = e.clientX - r.left + 14, yy = e.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width) x = e.clientX - r.left - tip.offsetWidth - 14;
    if (x < 0) x = 4;
    tip.style.left = x + 'px'; tip.style.top = yy + 'px';
  };
  wrap.onmousemove = e => { const g = e.target.closest('.day'); if (!g) { tip.hidden = true; return; } showTip(e, g); };
  wrap.onmouseleave = () => { tip.hidden = true; };
  wrap.onclick = e => {
    const g = e.target.closest('.day'); if (!g) return;
    if (onSelect) { tip.hidden = true; onSelect(days[+g.dataset.i].date); } else showTip(e, g);
  };
}

/* ==========================================================
   РЕДАКТОР ВИТРАТ (кількість × ціна)

function newExpenseModel(prefill) {
  const lines = CONFIG.EXPENSES.map(name => ({ name, qty: '', price: '', custom: false }));
  (prefill || []).forEach(p => {
    const l = lines.find(x => norm(x.name) === norm(p.name));
    if (l) { l.qty = p.qty; l.price = p.price; } else lines.push({ name: p.name, qty: p.qty, price: p.price, custom: true });
  });
  return { lines };
}
const isMapLine = l => norm(l.name) === norm(CONFIG.MAP_LABEL);
const lineTotal = l => lineSum(Math.floor(num(l.qty)), l.price);
const expenseTotal = m => m.lines.reduce((a, l) => a + Math.round(lineTotal(l) * 100), 0) / 100;

function expenseHTML(m) {
  return `<div class="ex">
    <div class="ex-head"><span>Стаття</span><span>Кількість</span><span>Ціна за од.</span><span class="r">Сума</span><span></span></div>
    ${m.lines.map((l, i) => `<div class="ex-row" data-l="${i}">
      <div class="ex-name">${l.custom ? `<input class="input" data-f="name" placeholder="Назва витрати" maxlength="60" value="${esc(l.name)}">` : `<b>${esc(l.name)}</b>${isMapLine(l) ? '<em class="req">обовʼязково</em>' : ''}`}</div>
      <input class="input" type="number" min="0" step="1" inputmode="numeric" placeholder="К-сть" data-f="qty" value="${esc(l.qty)}" aria-label="Кількість">

}
function refreshExpense(root, m, opts) {
  m.lines.forEach((l, i) => {
    const c = $(`.ex-row[data-l="${i}"] [data-lsum]`, root);
    if (c) { const t = lineTotal(l); c.textContent = t > 0 ? fmtMoney(t) : '—'; }
  });
  const e = $('[data-etotal]', root);
  if (e) e.textContent = fmtMoney(expenseTotal(m));
  opts && opts.onChange && opts.onChange();
}
function renderExpense(root, m, opts) { root.innerHTML = expenseHTML(m); refreshExpense(root, m, opts); }
function bindExpense(root, m, opts) {
  root.addEventListener('input', e => {
    const f = e.target.dataset.f, row = e.target.closest('.ex-row'); if (!f || !row) return;
    m.lines[+row.dataset.l][f] = e.target.value;
    refreshExpense(root, m, opts);
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'addLine') m.lines.push({ name: '', qty: '', price: '', custom: true });
    else if (b.dataset.act === 'rmLine') m.lines.splice(+b.closest('.ex-row').dataset.l, 1);
    else return;
    renderExpense(root, m, opts);
    opts && opts.onStructure && opts.onStructure();
  });
}
/** Перевіряє рядки й формує payload для API. Повертає { lines } або { error }. */
function expensePayload(m) {
  const lines = [];
  for (const l of m.lines) {
    const q = num(l.qty), p = num(l.price), name = l.name.trim();
    if (!q && !p) continue;
    if (!name) return { error: 'Вкажіть назву витрати' };
    if (q < 1 || Math.floor(q) !== q) return { error: `Кількість для «${name}» має бути цілим числом від 1` };
    if (!(p > 0)) return { error: `Вкажіть ціну за одиницю для «${name}»` };
    lines.push({ category: name, quantity: q, unitPrice: p });
  }
  return { lines };
}

/* ==========================================================
   РЕДАКТОР ЗНАХІДКИ (гроші + предмети з підказками)
   ========================================================== */
function draftTotals(d) {
  let items = 0, unknown = 0;
  d.items.forEach(it => {
    if (!it.name.trim()) return;
    const f = findItem(it.name);
    if (f) items += cents(f.price) * Math.max(0, Math.floor(num(it.qty)));
    else unknown++;
  });
  const money = Math.max(0, cents(d.money));
  return { money: money / 100, items: items / 100, unknown, total: (money + items) / 100 };
}

function draftHTML(d) {
  return `<label class="field"><span>Отримані гроші</span><div class="input-affix"><i>${CONFIG.CURRENCY}</i><input class="input" type="number" min="0" step="any" inputmode="decimal" placeholder="0" data-f="money" value="${esc(d.money)}"></div></label>
    <div class="field"><span>Предмети</span>
      <div class="irows">${d.items.map((it, ii) => `<div class="irow" data-i="${ii}">
        <input class="input" data-ac="items" data-f="name" placeholder="Почніть вводити назву…" value="${esc(it.name)}" autocomplete="off" spellcheck="false">
        <input class="input" type="number" min="1" step="1" data-f="qty" value="${esc(it.qty)}" aria-label="Кількість">
        <div class="iprice" data-price></div>
        <button class="icon-btn" data-act="rmRow" title="Прибрати предмет" aria-label="Прибрати предмет">${icon('x', 16)}</button>
      </div>`).join('')}</div>
      <div><button class="btn ghost sm" data-act="addRow">${icon('plus', 14)} Додати предмет</button></div>
    </div>
    <div class="tfoot" data-foot></div>`;
}
function refreshDraft(root, d, opts) {
  d.items.forEach((it, ii) => {
    const cell = $(`.irow[data-i="${ii}"] [data-price]`, root);
    if (!cell) return;
    const name = it.name.trim();
    if (!name) { cell.innerHTML = ''; return; }

  });

  opts && opts.onChange && opts.onChange();
}
function renderDraft(root, d, opts) { root.innerHTML = draftHTML(d); refreshDraft(root, d, opts); }
function bindDraft(root, d, opts) {
  root.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return;
    const row = e.target.closest('.irow');
    if (f === 'money') d.money = e.target.value;

    const b = e.target.closest('[data-act]'); if (!b) return;

    if (act === 'addRow') d.items.push({ name: '', qty: 1 });

    else return;

    opts && opts.onStructure && opts.onStructure();

}

      });
      refresh();
    }
  });
}

/* ---------- миттєвий відгук: інтерфейс оновлюється одразу, сервер підтверджує у фоні ---------- */
function nowTime() { return new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date()); }

function optimisticSale(lines) {
  const B = JSON.parse(JSON.stringify(State.boot)), h = B.activeHunt; if (!h) return;
  const date = todayISO(), time = nowTime();
  let totC = 0, qtyAll = 0, baseC = 0;
  lines.forEach(l => {
    const s = h.stock.find(x => String(x.itemId) === String(l.itemId)); if (!s) return;
    const c = Math.round(l.quantity * cents(l.price));
    totC += c; qtyAll += l.quantity; baseC += l.quantity * cents(s.price);
    s.qty -= l.quantity; s.value = round2(s.qty * s.price);
    B.sales.unshift({ id: 'tmp' + Date.now() + Math.random(), date, time, itemId: l.itemId, itemName: s.name, quantity: l.quantity, price: l.price, total: c / 100, huntId: h.id });
  });
  h.stock = h.stock.filter(s => s.qty > 0);
  const apply = x => {
    x.stock = h.stock.map(s => ({ ...s }));
    x.stockCount = Math.max(0, x.stockCount - qtyAll);
    x.stockValue = Math.max(0, round2(x.stockValue - baseC / 100));
    x.salesIncome = round2(x.salesIncome + totC / 100); x.income = round2(x.income + totC / 100); x.profit = round2(x.profit + totC / 100);
    x.toBreakEven = Math.max(0, round2(x.expenses - x.income));
    x.toBreakEvenAfterStock = Math.max(0, round2(x.expenses - x.income - x.stockValue));
    if (x.potentialProfit !== undefined) x.potentialProfit = round2(x.income + x.stockValue - x.expenses);
    const reasons = ((x.finish && x.finish.reasons) || []).filter(r => !/^Не продано/.test(r));
    if (x.stockCount > 0) reasons.push('Не продано предметів: ' + x.stockCount);
    x.finish = { canFinish: !reasons.length, reasons };
  };
  const hh = (B.hunts || []).find(x => String(x.id) === String(h.id));
  apply(h); if (hh && hh !== h) apply(hh);
  const D = B.dashboard;
  D.salesIncome = round2(D.salesIncome + totC / 100); D.income = round2(D.income + totC / 100); D.profit = round2(D.profit + totC / 100);
  D.salesCount += lines.length; D.itemsSold += qtyAll; D.stockCount = h.stockCount; D.stockValue = h.stockValue;
  if (D.potentialProfit !== undefined) D.potentialProfit = round2(D.profit + D.stockValue);
  const S = B.statistics, day = S.days.find(x => x.date === date);
  if (day) {
    day.income = round2(day.income + totC / 100); day.profit = round2(day.profit + totC / 100); day.salesCount += lines.length;
    S.totals.income = round2(S.totals.income + totC / 100); S.totals.profit = round2(S.totals.profit + totC / 100); S.totals.salesCount += lines.length;
  }
  applyState(B, { render: true, soft: true });
}

async function legacySales(lines) {
  let last = null; const tg = { triggered: false, sent: false, error: null };
  for (const l of lines) {
    last = await api('addSale', { itemId: l.itemId, quantity: l.quantity, price: l.price });
    const t = last.telegram; if (t) { tg.triggered = tg.triggered || t.triggered; tg.sent = tg.sent || t.sent; tg.error = tg.error || t.error; }
  }
  return { state: last.state, telegram: tg };
}

async function submitSales(lines, keep) {
  State.pending++;
  optimisticSale(lines); burst('💰');
  let d = null, err = null;
  try {
    const payload = { lines: lines.map(l => ({ itemId: l.itemId, quantity: l.quantity, price: l.price })), keep };
    try { d = await api('addSales', payload); }
    catch (e) { if (/Невідома дія/i.test(e.message || '')) d = await legacySales(lines); else throw e; }
  } catch (e) { err = e; }
  State.pending--;
  if (err) {
    toast(err.message || 'Не вдалося зберегти продаж', 'warn');
    if (!State.pending) refreshBoot(true).catch(() => {});      // повертаємо справжній стан із сервера
    return;
  }
  if (!State.pending) applyState(d.state, { soft: true });
  toast(lines.length > 1 ? `Продано позицій: ${lines.length}` : 'Продаж успішно додано');
  const tg = d.telegram;
  if (tg && tg.sent) toast('Лог надіслано в Telegram');
  else if (tg && tg.triggered) toast('Продаж збережено, але Telegram не відповів: ' + (tg.error || 'невідома помилка'), 'warn');
}

let renderTimer = 0;
function scheduleRender() {
  clearTimeout(renderTimer);
  const go = () => {
    if (!State.boot) return;

    const typing = ae && ae !== document.body && $('#view').contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
    if ($('#modalRoot').childElementCount || typing) { renderTimer = setTimeout(go, 1200); return; }   // не заважаємо вводу
    renderPage();
  };
  go();
}

async function refreshBoot(force) {
  const s = await api('getBootstrap', {}, { silent: true });
  if (State.pending && !force) return;
  applyState(s, { render: false, soft: true });
  if (State.page !== 'admin') scheduleRender();
}

const Live = {
  t: null, busy: false, off: false,
  interval() {
    const c = (State.boot && State.boot.config) || {};
    const fast = isAdmin() && State.page === 'admin' && State.adm.live;
    return Math.max(1500, fast ? (c.pollAdminMs || 3000) : (c.pollUserMs || 10000));
  },
  start() { this.stop(); this.off = false; if (State.token) this.loop(); },
  stop() { clearTimeout(this.t); this.t = null; },
  loop() {
    clearTimeout(this.t);
    if (!State.token || this.off) return;
    this.t = setTimeout(async () => { await this.tick(); this.loop(); }, this.interval());
  },
  kick() {
    if (!State.token || !State.boot || this.off) return;
    clearTimeout(this.t);
    if (Date.now() - State.lastSync > 90000) refreshBoot().catch(() => {});
    this.tick().finally(() => this.loop());
  },
  async tick() {
    if (this.busy || document.hidden || !State.boot || State.pending) return;
    this.busy = true;
    try {
      const r = await api('getRev', { uid: State.profile.id }, { silent: true, retry: false });
      if (State.rev.g == null) State.rev = { g: r.g, u: r.u };
      const adminView = isAdmin() && State.page === 'admin';
      if (adminView && State.adm.rev == null) State.adm.rev = r.g;
      const jobs = [];
      if (adminView && r.g !== State.adm.rev) jobs.push(loadAdmin(true, true).then(() => { if (State.page === 'admin' && $('#adBody')) drawAdmin(false); }));
      const own = r.u !== State.rev.u, glob = r.g !== State.rev.g && State.page === 'leaderboard';
      if (own || glob) jobs.push(refreshBoot());
      await Promise.all(jobs);
    } catch (e) {
      if (/Невідома дія/i.test((e && e.message) || '')) this.off = true;   // старий бекенд без live: просто вимикаємо
    } finally { this.busy = false; }
  }
};

async function finishFlow() {

  const ok = await confirmModal({
    title: ready ? 'Завершити пошук?' : 'Завершити примусово?',
    text: ready
      ? `Усі карти використано, рюкзак порожній. Підсумок: витрати ${fmtMoney(h.expenses)}, дохід ${fmtMoney(h.income)}, результат <b class="${tone(h.profit)}">${signed(h.profit)}</b>.`
      : `Пошук ще не готовий: ${h.finish.reasons.map(esc).join('; ')}. Як адміністратор ви можете завершити його примусово, непродані предмети буде втрачено з обліку.`,
    ok: ready ? 'Завершити' : 'Завершити примусово', kind: ready ? 'primary' : 'danger'

  });
}

  } catch (_) {}
  State.calc = defaultCalc();
}

function calcTotals() {
  const exp = expenseTotal(State.calc.exp), inc = draftTotals(State.calc.inc).total;

}

    <div class="field grow"><span>Пошук</span><div class="input-affix search"><i>${icon('search', 16)}</i><input class="input" id="hQ" placeholder="Назва коштовності" value="${esc(h.q)}"></div></div>
    <div class="field"><span>Період</span><select class="input" id="hPeriod">
      ${[['all', 'Весь час'], ['today', 'Сьогодні'], ['7d', 'Останні 7 днів'], ['30d', 'Останні 30 днів'], ['month', 'Цей місяць'], ['custom', 'Свій діапазон']].map(([k, l]) => `<option value="${k}" ${h.period === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><span>Від</span><input class="input" type="date" id="hFrom" value="${h.from}"></div>
    <div class="field"><span>До</span><input class="input" type="date" id="hTo" value="${h.to}"></div>
    <div class="field"><span>Сортування</span><select class="input" id="hSort">
      ${[['date_desc', 'Дата: спочатку нові'], ['date_asc', 'Дата: спочатку старі'], ['total_desc', 'Сума: більші'], ['total_asc', 'Сума: менші']].map(([k, l]) => `<option value="${k}" ${h.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <button class="btn ghost" id="hReset">Скинути</button>
  </section>
  <section class="card p0" id="hBody"></section>`;
  const draw = () => {
    const sig = [h.q, h.from, h.to, h.sort].join('|'); if (sig !== h._sig) { h._sig = sig; h.limit = PAGE_SIZE; }
    const qn = norm(h.q);
    let list = State.boot.sales.filter(s => (!qn || (s._n || (s._n = norm(s.itemName))).includes(qn)) && (!h.from || s.date >= h.from) && (!h.to || s.date <= h.to));
    const cmp = { date_desc: (a, b) => (b.date + b.time).localeCompare(a.date + a.time) || b.id - a.id, date_asc: (a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.id - b.id, total_desc: (a, b) => b.total - a.total, total_asc: (a, b) => a.total - b.total }[h.sort];
    list = list.slice().sort(cmp);
    const sum = list.reduce((a, s) => a + cents(s.total), 0) / 100;
    const n = Math.min(list.length, h.limit);
    $('#hBody').innerHTML = salesTable(list.slice(0, n)) + moreBtn(n, list.length, 'hs') + (list.length ? `<div class="table-foot"><span>Показано: ${n} з ${list.length}</span><span>Разом <b>${fmtMoney(sum)}</b></span></div>` : '');
  };
  $('#hQ').oninput = debounce(e => { h.q = e.target.value; draw(); }, 140);
  $('#hSort').onchange = e => { h.sort = e.target.value; draw(); };
  $('#hPeriod').onchange = e => {
    const p = h.period = e.target.value, t = todayISO();
    if (p === 'all') { h.from = h.to = ''; }
    if (p === 'today') { h.from = h.to = t; }
    if (p === '7d') { h.from = addDays(t, -6); h.to = t; }
    if (p === '30d') { h.from = addDays(t, -29); h.to = t; }
    if (p === 'month') { h.from = t.slice(0, 8) + '01'; h.to = t; }
    $('#hFrom').value = h.from; $('#hTo').value = h.to; draw();
  };
  const custom = () => { h.from = $('#hFrom').value; h.to = $('#hTo').value; h.period = 'custom'; $('#hPeriod').value = 'custom'; draw(); };
  $('#hFrom').onchange = custom; $('#hTo').onchange = custom;
  $('#hBody').onclick = e => { if (e.target.closest('[data-more="hs"]')) { h.limit += PAGE_SIZE; draw(); } };
  $('#hReset').onclick = () => { Object.assign(State.hist, { q: '', period: 'all', from: '', to: '', sort: 'date_desc' }); renderHistory(v); };
  draw();
}

/* ==========================================================
   СТАТИСТИКА (інтерактивна)
   ========================================================== */
async function loadStats(params) {
  await guard(null, async () => {
    State.stats.data = await api('getStatistics', params);
    State.stats.sel = undefined;
    renderPage();
  });
}

function dayEvents(date) {
  const B = State.boot, ev = [];
  B.sales.filter(s => s.date === date).forEach(s => ev.push({ time: s.time, kind: 'Продаж', text: `${esc(s.itemName)} ×${s.quantity} по ${fmtMoney(s.price)}`, amount: s.total }));
  B.treasures.filter(t => t.date === date).forEach(t => {
    if (t.result === 'failed') ev.push({ time: t.time, kind: 'Карта', text: `Карта №${t.number}: на жаль, не спрацювала`, amount: 0 });
    else ev.push({ time: t.time, kind: 'Скарб', text: `Карта №${t.number}: ${[t.money > 0 ? fmtMoney(t.money) : '', ...t.items.map(i => `${esc(i.name)} ×${i.qty}`)].filter(Boolean).join(', ')}`, amount: t.money });
  });
  B.expenses.filter(e => e.date === date).forEach(e => ev.push({ time: e.time, kind: 'Витрата', text: `${esc(e.category)} ×${e.quantity} по ${fmtMoney(e.unitPrice)}`, amount: -e.amount }));
  return ev.sort((a, b) => b.time.localeCompare(a.time));
}

function dayDetailHTML(w, date) {
  if (!date) return '';
  const d = w.days.find(x => x.date === date); if (!d) return '';
  const ev = dayEvents(date);
  return `<section class="card p0 mb"><div class="card-h" style="padding:20px 20px 0"><h2>${WEEKDAYS[d.weekday]}, ${fmtDate(d.date)}</h2>
      <span class="chip green">Дохід ${fmtMoney(d.income)}</span></div>
    ${ev.length ? `<div class="table-wrap"><table class="table mini stack"><thead><tr><th>Час</th><th>Тип</th><th>Подія</th><th class="r">Сума</th></tr></thead><tbody>${ev.map(e => `<tr><td data-label="Час">${fmtTime(e.time)}</td><td data-label="Тип"><span class="chip">${e.kind}</span></td><td data-label="Подія">${e.text}</td><td class="r ${tone(e.amount)}" data-label="Сума" style="font-weight:700">${e.amount ? signed(e.amount) : '—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="table-foot"><span>Витрати <b class="neg">${fmtMoney(d.expenses)}</b></span><span>Прибуток <b class="${tone(d.profit)}">${signed(d.profit)}</b></span></div>` : emptyState('history', 'У цей день подій немає')}</section>`;
}

function renderStatistics(v) {
  const S = State.stats, w = S.data || State.boot.statistics, t = w.totals;
  if (S.sel === undefined) { const td = todayISO(); S.sel = w.days.some(d => d.date === td) ? td : ''; }
  if (!S.from) { S.from = w.from; S.to = w.to; }
  const range = S.mode === 'range';
  v.innerHTML = pageHead('Статистика', 'Дохід, витрати та прибуток по днях. Клікніть на день, щоб побачити подробиці') + `
  <section class="card filters">
    <div class="seg" id="stMode"><button data-m="week" class="${range ? '' : 'on'}">Тиждень</button><button data-m="range" class="${range ? 'on' : ''}">Свій період</button></div>
    ${range
      ? `<div class="field"><span>Від</span><input class="input" type="date" id="stFrom" value="${S.from}"></div><div class="field"><span>До</span><input class="input" type="date" id="stTo" value="${S.to}"></div><button class="btn primary" id="stApply">Показати</button>`
      : `<div class="week-nav"><button class="icon-btn" data-w="-1" aria-label="Попередній тиждень">${icon('left', 18)}</button>
          <span class="week-label">${fmtDateShort(w.from)} – ${fmtDate(w.to)}</span>
          <button class="icon-btn" data-w="1" aria-label="Наступний тиждень" ${(w.weekOffset ?? 0) >= 0 ? 'disabled' : ''}>${icon('right', 18)}</button>
          ${(w.weekOffset ?? 0) !== 0 ? `<button class="btn sm" data-w="0">Поточний</button>` : ''}</div>
        <div class="field"><span>Обрати дату вручну</span><input class="input" type="date" id="stDate" value="${w.from}"></div>`}
  </section>
  <div class="grid stats">
    ${statCard('Дохід', fmtMoney(t.income), 'trend', 'green')}
    ${statCard('Витрати', fmtMoney(t.expenses), 'wallet', 'red')}
    ${statCard('Прибуток', `<span class="${tone(t.profit)}">${signed(t.profit)}</span>`, 'dollar', 'gold')}
    ${statCard('Продажі', t.salesCount, 'cash', 'blue')}
    ${statCard('Скарби', t.treasuresCount, 'map', '', `Невдалих карт: ${t.failedCount}`)}
    ${statCard('Коштовності', t.jewelsCount, 'gem', 'gold')}
  </div>
  <section class="card mb">
    <div class="card-h"><h2>Динаміка по днях</h2>
      <div class="seg" id="stSeries">${[['both', 'Усе'], ['income', 'Дохід'], ['expenses', 'Витрати'], ['profit', 'Прибуток']].map(([k, l]) => `<button data-s="${k}" class="${S.series === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="chart-wrap" id="stChart"></div><div id="stLegend"></div>
  </section>
  <div id="stDay"></div>
  <section class="card p0"><div class="table-wrap"><table class="table stack"><thead><tr><th>День</th><th class="r">Дохід</th><th class="r">Витрати</th><th class="r">Прибуток</th><th class="r">Продажі</th><th class="r">Скарби</th></tr></thead><tbody>
    ${w.days.map(d => `<tr class="click ${S.sel === d.date ? 'sel' : ''}" data-date="${d.date}"><td data-label="День"><span class="cell-main">${WEEKDAYS[d.weekday]}</span> <span class="cell-sub">${fmtDate(d.date)}</span></td><td class="r" data-label="Дохід">${fmtMoney(d.income)}</td><td class="r" data-label="Витрати">${fmtMoney(d.expenses)}</td><td class="r ${tone(d.profit)}" data-label="Прибуток">${signed(d.profit)}</td><td class="r" data-label="Продажі">${d.salesCount}</td><td class="r" data-label="Скарби">${d.treasuresCount}${d.failedCount ? ` <span class="muted">(-${d.failedCount})</span>` : ''}</td></tr>`).join('')}
  </tbody></table></div></section>`;

  const draw = () => {
    $('#stChart').innerHTML = chartSVG(w.days, S.series, S.sel) + '<div class="tip" hidden></div>';
    $('#stLegend').innerHTML = chartLegend(S.series);
    $('#stDay').innerHTML = dayDetailHTML(w, S.sel);
    $$('#stSeries button').forEach(b => b.classList.toggle('on', b.dataset.s === S.series));
    $$('tr[data-date]', v).forEach(r => r.classList.toggle('sel', r.dataset.date === S.sel));
    bindChart($('#stChart'), w.days, date => { S.sel = S.sel === date ? '' : date; draw(); });
  };
  draw();

  v.onclick = e => {
    const s = e.target.closest('[data-s]');
    if (s) { S.series = s.dataset.s; return draw(); }
    const tr = e.target.closest('tr[data-date]');
    if (tr) { S.sel = S.sel === tr.dataset.date ? '' : tr.dataset.date; return draw(); }
    const m = e.target.closest('[data-m]');
    if (m && m.dataset.m !== S.mode) {
      S.mode = m.dataset.m;
      if (S.mode === 'week') { S.data = State.boot.statistics; S.sel = undefined; S.from = ''; }
      return renderPage();
    }
    const wk = e.target.closest('[data-w]');
    if (wk && !wk.disabled) {
      const off = wk.dataset.w === '0' ? 0 : (w.weekOffset || 0) + Number(wk.dataset.w);
      if (off === 0) { S.data = State.boot.statistics; S.sel = undefined; return renderPage(); }
      return loadStats({ weekOffset: off });
    }
    if (e.target.closest('#stApply')) {
      const from = $('#stFrom').value, to = $('#stTo').value;
      if (!from || !to) return toast('Вкажіть обидві дати', 'warn');
      S.from = from; S.to = to;
      return loadStats({ from, to });
    }
  };
  v.onchange = e => { if (e.target.id === 'stDate' && e.target.value) loadStats({ date: e.target.value }); };
}

    `<p class="hint">${lb.me ? `Ваше місце: <b>${lb.me.rank}</b> з ${lb.participants}, сума продажів ${fmtMoney(lb.me.total)}.` : 'Зробіть перший продаж, щоб потрапити до рейтингу.'} Показуються лише нікнейми та суми продажів.</p>`;

function renderLists(v) {
  const L = State.listQ, cats = ['all', ...categories().sort()];
  v.innerHTML = pageHead('Списки', 'Спільна база предметів і коштовностей для всіх користувачів', `<button class="btn primary" id="lAdd">${icon('plus', 16)} Додати предмет</button>`) + `
  <section class="card filters">
    <div class="field grow"><span>Пошук</span><div class="input-affix search"><i>${icon('search', 16)}</i><input class="input" id="lQ" placeholder="Назва предмета" value="${esc(L.q)}"></div></div>
    <div class="field"><span>Категорія</span><select class="input" id="lCat">${cats.map(c => `<option value="${esc(c)}" ${L.cat === c ? 'selected' : ''}>${c === 'all' ? 'Усі категорії' : esc(c)}</option>`).join('')}</select></div>
    <div class="field"><span>Сортування</span><select class="input" id="lSort">${[['name_asc', 'Назва: А → Я'], ['name_desc', 'Назва: Я → А'], ['price_desc', 'Ціна: дорожчі'], ['price_asc', 'Ціна: дешевші']].map(([k, l]) => `<option value="${k}" ${L.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  </section>
  <section class="card p0" id="lBody"></section>`;
  const canEdit = State.boot.config.allowItemEdit;
  const draw = () => {
    let list = State.boot.items.filter(i => (!L.q || norm(i.name).includes(norm(L.q))) && (L.cat === 'all' || i.category === L.cat));
    const cmp = { name_asc: (a, b) => a.name.localeCompare(b.name), name_desc: (a, b) => b.name.localeCompare(a.name), price_desc: (a, b) => b.price - a.price, price_asc: (a, b) => a.price - b.price }[L.sort];
    list = list.slice().sort(cmp);
    $('#lBody').innerHTML = list.length ? `<div class="table-wrap"><table class="table stack"><thead><tr><th>Назва</th><th>Категорія</th><th class="r">Вартість</th>${canEdit ? '<th style="width:56px"></th>' : ''}</tr></thead><tbody>
      ${list.map(i => `<tr><td data-label="Назва" class="cell-main">${esc(i.name)}</td><td data-label="Категорія"><span class="chip">${esc(i.category)}</span></td><td class="r gold" data-label="Вартість" style="font-weight:800">${fmtMoney(i.price)}</td>${canEdit ? `<td class="nolabel"><button class="icon-btn" data-edit="${i.id}" aria-label="Редагувати">${icon('edit', 16)}</button></td>` : ''}</tr>`).join('')}
    </tbody></table></div><div class="table-foot"><span>Предметів: ${list.length}</span></div>` : emptyState('list', 'Нічого не знайдено', 'Змініть пошук або додайте новий предмет');
  };
  $('#lQ').oninput = e => { L.q = e.target.value; draw(); };
  $('#lCat').onchange = e => { L.cat = e.target.value; draw(); };
  $('#lSort').onchange = e => { L.sort = e.target.value; draw(); };
  $('#lAdd').onclick = () => openItemModal(null);
  v.onclick = e => { const b = e.target.closest('[data-edit]'); if (b) openItemModal(State.boot.items.find(i => String(i.id) === b.dataset.edit)); };
  draw();
}

function openItemModal(item) {
  const isNew = !item;
  openModal({
    title: isNew ? 'Новий предмет' : 'Редагувати предмет',
    body: `<label class="field"><span>Назва</span><input class="input" id="imName" maxlength="120" value="${esc(item ? item.name : '')}"></label>
      ${categoryField('imCat', item ? item.category : CONFIG.DEFAULT_CATEGORY)}
      <label class="field"><span>Вартість</span><div class="input-affix"><i>${CONFIG.CURRENCY}</i><input class="input" id="imPrice" type="number" min="0" step="any" inputmode="decimal" value="${item ? item.price : ''}"></div></label>`,
    actions: [
      { label: 'Скасувати', kind: 'ghost', onClick: m => m.close() },
      { label: 'Зберегти', kind: 'primary', onClick: (m, btn) => guard(btn, async () => {
          const name = $('#imName', m.el).value.trim(), price = $('#imPrice', m.el).value;
          if (!name) { toast('Вкажіть назву предмета', 'warn'); return; }
          if (price === '') { toast('Вкажіть вартість предмета', 'warn'); return; }
          const payload = { name, category: readCategory(m.el, 'imCat'), price: num(price) };
          const d = isNew ? await api('addItem', payload) : await api('updateItem', { id: item.id, ...payload });
          m.close(); applyState(d.state);
          toast(isNew ? (d.existed ? 'Такий предмет уже є в базі' : 'Предмет додано до бази') : 'Дані оновлено');
        }) }
    ],
    onMount: m => bindCategoryField(m.el, 'imCat')
  });
}
